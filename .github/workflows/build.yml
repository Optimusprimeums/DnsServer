name: Build

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      technitium_library_ref:
        description: "TechnitiumLibrary commit, tag or branch to build against"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # TechnitiumLibrary is a separate repo that DnsServer references by relative path (../TechnitiumLibrary/bin).
  # Pinned so builds are reproducible; bump it when syncing with upstream.
  TECHNITIUM_LIBRARY_REF: 4a5a530ac6c4114e72216e0b9c74208a7a5e3fa0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # rolling release the one-line installer downloads from; the branch that updates it is set in the release job's `if`
  RELEASE_TAG: fork-latest

jobs:
  build:
    # own self-hosted runners for everything from this repo; pull requests from outside forks run on
    # GitHub-hosted runners so untrusted code never executes on the homelab CI servers
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "big"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push image to ghcr.io

    steps:
      - name: Checkout DnsServer
        uses: actions/checkout@v4
        with:
          path: DnsServer

      - name: Checkout TechnitiumLibrary
        uses: actions/checkout@v4
        with:
          repository: TechnitiumSoftware/TechnitiumLibrary
          ref: ${{ github.event.inputs.technitium_library_ref || env.TECHNITIUM_LIBRARY_REF }}
          path: TechnitiumLibrary

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        env:
          # default install dir (/usr/share/dotnet) needs root; the runner's tool cache is writable and persists between runs
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      # self-hosted runners may not ship Node; needed for the web console syntax check
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TechnitiumLibrary
        run: |
          dotnet build TechnitiumLibrary/TechnitiumLibrary.ByteTree/TechnitiumLibrary.ByteTree.csproj -c Release
          dotnet build TechnitiumLibrary/TechnitiumLibrary.Net/TechnitiumLibrary.Net.csproj -c Release
          dotnet build TechnitiumLibrary/TechnitiumLibrary.Security.OTP/TechnitiumLibrary.Security.OTP.csproj -c Release

      - name: Publish DnsServerApp
        run: dotnet publish DnsServer/DnsServerApp/DnsServerApp.csproj -c Release

      # same layout and file name as the official DnsServerPortable.tar.gz, so the stock installer logic works unchanged
      - name: Package portable tarball and installer
        run: |
          mkdir -p bundle
          tar -czf bundle/DnsServerPortable.tar.gz -C DnsServer/DnsServerApp/bin/Release/publish .

          # generate the fork installer from upstream's installer by swapping only the download URL
          officialUrl='dnsUrl="https://download.technitium.com/dns/DnsServerPortable.tar.gz"'
          forkUrl="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/DnsServerPortable.tar.gz"

          if ! grep -qF "$officialUrl" DnsServer/DnsServerApp/install.sh; then
            echo "::error file=DnsServerApp/install.sh::Download URL line not found; upstream installer changed, update this step"
            exit 1
          fi

          sed -e "s#^dnsUrl=.*#dnsUrl=\"\${DNS_TAR_URL:-${forkUrl}}\"#" \
              -e "s#^echo \"Technitium DNS Server Installer\"#echo \"Technitium DNS Server Installer (${GITHUB_REPOSITORY} build)\"#" \
              DnsServer/DnsServerApp/install.sh > bundle/install.sh
          chmod +x bundle/install.sh

          sh -n bundle/install.sh
          grep -n '^dnsUrl=' bundle/install.sh
          tar -tzf bundle/DnsServerPortable.tar.gz | grep -qx './DnsServerApp.dll'
          tar -tzf bundle/DnsServerPortable.tar.gz | grep -qx './systemd.service'

      - name: Upload install bundle
        uses: actions/upload-artifact@v4
        with:
          name: install-bundle
          path: bundle
          retention-days: 7
          if-no-files-found: error

      - name: Check web console JavaScript syntax
        working-directory: DnsServer/DnsServerCore/www/js
        run: |
          for f in *.js; do
            case "$f" in *.min.js) continue ;; esac
            node -e "new Function(require('fs').readFileSync(process.argv[1], 'utf8').replace(/^﻿/, ''))" "$f" \
              || { echo "::error file=DnsServerCore/www/js/$f::JavaScript syntax error"; exit 1; }
            echo "ok $f"
          done

      # the image copies the platform-neutral publish output onto the multi-arch aspnet base image,
      # so amd64 (PCs, NUCs) and arm64 (Raspberry Pi 4/5) are built from the same publish folder
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dnsserver
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # pull requests only build the image; pushes to this repo also publish it
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: DnsServer
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DnsServer-${{ github.sha }}
          path: DnsServer/DnsServerApp/bin/Release/publish
          retention-days: 14
          if-no-files-found: error

  # rolling pre-release so homelab servers can install/update with:
  #   curl -sSL https://github.com/<owner>/DnsServer/releases/download/fork-latest/install.sh | sudo bash
  release:
    needs: build
    # change the branch here (e.g. to master) once the fork's work is merged there
    if: github.event_name == 'push' && github.ref_name == 'feature/dhcp-failover'
    runs-on: [self-hosted, Linux, X64, big]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download install bundle
        uses: actions/download-artifact@v4
        with:
          name: install-bundle
          path: bundle

      - name: Replace rolling release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;

            // drop the previous release and tag so the tag always points at the build's commit
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: existing.data.id });
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              if ((e.status !== 404) && (e.status !== 422)) throw e;
            }

            const shortSha = context.sha.substring(0, 7);
            const installUrl = `https://github.com/${owner}/${repo}/releases/download/${tag}/install.sh`;

            const release = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Fork build ${shortSha} (${context.ref.replace('refs/heads/', '')})`,
              prerelease: true,
              body: [
                `Automated build of \`${context.ref.replace('refs/heads/', '')}\` at ${context.sha}.`,
                '',
                'Install or update in place (keeps settings in /etc/dns):',
                '```',
                `curl -sSL ${installUrl} | sudo bash`,
                '```',
                '',
                'Docker:',
                '```',
                `docker pull ghcr.io/${owner.toLowerCase()}/dnsserver:sha-${shortSha}`,
                '```'
              ].join('\n')
            });

            for (const name of ['DnsServerPortable.tar.gz', 'install.sh']) {
              const data = fs.readFileSync(path.join('bundle', name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo,
                release_id: release.data.id,
                name,
                data,
                headers: {
                  'content-type': name.endsWith('.gz') ? 'application/gzip' : 'text/x-shellscript',
                  'content-length': data.length
                }
              });
            }

            core.notice(`Install with: curl -sSL ${installUrl} | sudo bash`);
