name: Build

on:
  push:
    branches: [master, "fork/**", "feature/**"]
    # docs-only pushes would otherwise publish a new numbered release with identical binaries
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      technitium_library_ref:
        description: "TechnitiumLibrary commit, tag or branch to build against"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # never cancel a push build mid-release (it would leave fork-latest missing); PR builds can be superseded
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # TechnitiumLibrary is a separate repo that DnsServer references by relative path (../TechnitiumLibrary/bin).
  # Pinned so builds are reproducible; bump it when syncing with upstream.
  TECHNITIUM_LIBRARY_REF: 4a5a530ac6c4114e72216e0b9c74208a7a5e3fa0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # rolling release the one-line installer and the web console update check use; the branch that updates it is set in the release job's `if`
  RELEASE_TAG: fork-latest
  # how many numbered releases (v<version>) to keep for rollback
  KEEP_NUMBERED_RELEASES: 20

jobs:
  build:
    # own self-hosted runners for everything from this repo; pull requests from outside forks run on
    # GitHub-hosted runners so untrusted code never executes on the homelab CI servers
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "big"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push image to ghcr.io
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout DnsServer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: DnsServer

      - name: Checkout TechnitiumLibrary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: TechnitiumSoftware/TechnitiumLibrary
          ref: ${{ github.event.inputs.technitium_library_ref || env.TECHNITIUM_LIBRARY_REF }}
          path: TechnitiumLibrary

      # fork version = <upstream version>.<run number>, e.g. 15.6.2.57; the commit goes in the informational version
      - name: Compute fork version
        id: version
        run: |
          base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DnsServer/DnsServerApp/DnsServerApp.csproj | head -n 1)

          if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=DnsServerApp/DnsServerApp.csproj::Expected a 3-part upstream <Version>, found '$base'"
            exit 1
          fi

          if [ "${GITHUB_RUN_NUMBER}" -gt 65534 ]; then
            echo "::error::Run number ${GITHUB_RUN_NUMBER} exceeds the assembly version limit (65534)"
            exit 1
          fi

          version="${base}.${GITHUB_RUN_NUMBER}"
          info="${version}+${GITHUB_SHA::7}"

          echo "FORK_VERSION=${version}" >> "$GITHUB_ENV"
          echo "FORK_INFO_VERSION=${info}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Fork version ${info}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        env:
          # default install dir (/usr/share/dotnet) needs root; the runner's tool cache is writable and persists between runs
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      # self-hosted runners may not ship Node; needed for the web console syntax check
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build TechnitiumLibrary
        run: |
          dotnet build TechnitiumLibrary/TechnitiumLibrary.ByteTree/TechnitiumLibrary.ByteTree.csproj -c Release
          dotnet build TechnitiumLibrary/TechnitiumLibrary.Net/TechnitiumLibrary.Net.csproj -c Release
          dotnet build TechnitiumLibrary/TechnitiumLibrary.Security.OTP/TechnitiumLibrary.Security.OTP.csproj -c Release

      # version and update feed are set at build time so the project files stay identical to upstream
      - name: Publish DnsServerApp
        run: |
          dotnet publish DnsServer/DnsServerApp/DnsServerApp.csproj -c Release \
            -p:Version="${FORK_VERSION}" \
            -p:InformationalVersion="${FORK_INFO_VERSION}" \
            -p:UpdateCheckUri="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/update.json"

      # web files are listed one by one in DnsServerCore.csproj; a file added to www but not to the project
      # silently ships missing (this happened with acme.js), so compare the source folder with the build output
      - name: Check web console files are published
        run: |
          missing=0
          for root in www dohwww; do
            while IFS= read -r f; do
              if [ ! -f "DnsServer/DnsServerApp/bin/Release/publish/$root/$f" ]; then
                echo "::error file=DnsServerCore/DnsServerCore.csproj::DnsServerCore/$root/$f is not in the build output; add it to DnsServerCore.csproj"
                missing=1
              fi
            done < <(cd "DnsServer/DnsServerCore/$root" && find . -type f | sed 's|^\./||')
          done
          [ "$missing" -eq 0 ] && echo "All web console files are published."
          exit "$missing"

      # same layout and file name as the official DnsServerPortable.tar.gz, so the stock installer logic works unchanged
      - name: Package portable tarball
        run: |
          officialUrl='dnsUrl="https://download.technitium.com/dns/DnsServerPortable.tar.gz"'

          if ! grep -qF "$officialUrl" DnsServer/DnsServerApp/install.sh; then
            echo "::error file=DnsServerApp/install.sh::Download URL line not found; upstream installer changed, update the release job"
            exit 1
          fi

          mkdir -p bundle
          tar -czf bundle/DnsServerPortable.tar.gz -C DnsServer/DnsServerApp/bin/Release/publish .
          cp DnsServer/DnsServerApp/install.sh bundle/install.upstream.sh
          echo "${FORK_VERSION}" > bundle/version.txt

          tar -tzf bundle/DnsServerPortable.tar.gz | grep -qx './DnsServerApp.dll'
          tar -tzf bundle/DnsServerPortable.tar.gz | grep -qx './systemd.service'

      - name: Upload install bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-bundle
          path: bundle
          retention-days: 7
          if-no-files-found: error

      - name: Check web console JavaScript syntax
        working-directory: DnsServer/DnsServerCore/www/js
        run: |
          for f in *.js; do
            case "$f" in *.min.js) continue ;; esac
            node -e "new Function(require('fs').readFileSync(process.argv[1], 'utf8').replace(/^﻿/, ''))" "$f" \
              || { echo "::error file=DnsServerCore/www/js/$f::JavaScript syntax error"; exit 1; }
            echo "ok $f"
          done

      # the image copies the platform-neutral publish output onto the multi-arch aspnet base image,
      # so amd64 (PCs, NUCs) and arm64 (Raspberry Pi 4/5) are built from the same publish folder
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dnsserver
          tags: |
            type=raw,value=${{ env.FORK_VERSION }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ env.FORK_INFO_VERSION }}

      # pull requests only build the image; pushes to this repo also publish it
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: DnsServer
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DnsServer-${{ env.FORK_VERSION }}
          path: DnsServer/DnsServerApp/bin/Release/publish
          retention-days: 14
          if-no-files-found: error

  # End-to-end ACME test against Pebble (Let's Encrypt's test CA): issues certificates through the local
  # zone, CNAME delegation and RFC 2136 providers and verifies them over HTTPS. See .github/acme-e2e/run.sh.
  acme-e2e:
    needs: build
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "big"]') }}
    timeout-minutes: 30

    steps:
      - name: Checkout DnsServer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: DnsServer

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DnsServer-${{ needs.build.outputs.version }}
          path: DnsServer/DnsServerApp/bin/Release/publish

      - name: Build local test image (amd64, not pushed)
        working-directory: DnsServer
        run: docker build -q -t "technitium-acme-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .

      - name: Run ACME end-to-end test
        run: bash DnsServer/.github/acme-e2e/run.sh "technitium-acme-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Remove test image
        if: always()
        run: docker rmi -f "technitium-acme-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true

  # Publishes two releases per build:
  #   v<version>   - kept for rollback; its install.sh installs exactly that build
  #   fork-latest  - rolling; its install.sh always installs the newest build, and its update.json feeds the web console update check
  # Install/update:  curl -fsSLo install.sh https://github.com/<owner>/DnsServer/releases/download/fork-latest/install.sh && sudo bash install.sh
  release:
    # nothing is published unless the ACME end-to-end test passes too
    needs: [build, acme-e2e]
    # change the branch here (e.g. to master) once the fork's work is merged there
    if: github.event_name == 'push' && github.ref_name == 'fork/main'
    # GitHub-hosted on purpose: this job holds a contents: write token and only calls the GitHub API,
    # so it never runs on the persistent self-hosted runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # sign the provenance attestation; only here, never on the self-hosted runners
      attestations: write

    steps:
      - name: Download install bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-bundle
          path: bundle

      # signed provenance: lets anyone check a downloaded tarball was published by this workflow from this repo
      #   gh attestation verify DnsServerPortable.tar.gz -R <owner>/DnsServer
      - name: Attest release tarball provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: bundle/DnsServerPortable.tar.gz

      - name: Publish releases
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FORK_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const version = process.env.FORK_VERSION;
            const rollingTag = process.env.RELEASE_TAG;
            const keep = parseInt(process.env.KEEP_NUMBERED_RELEASES, 10);
            const branch = context.ref.replace('refs/heads/', '');
            const shortSha = context.sha.substring(0, 7);
            const numberedTag = `v${version}`;
            const base = `https://github.com/${owner}/${repo}`;
            const upstreamInstaller = fs.readFileSync(path.join('bundle', 'install.upstream.sh'), 'utf8');
            const tarball = fs.readFileSync(path.join('bundle', 'DnsServerPortable.tar.gz'));
            const tarballSha256 = require('crypto').createHash('sha256').update(tarball).digest('hex');
            const sha256Sums = Buffer.from(`${tarballSha256}  DnsServerPortable.tar.gz\n`, 'utf8');

            if (fs.readFileSync(path.join('bundle', 'version.txt'), 'utf8').trim() !== version)
              throw new Error('bundle version does not match build version');

            // upstream installer with these changes:
            //  - download URL points at this fork's release (DNS_TAR_URL overrides it)
            //  - curl follows redirects: GitHub release downloads redirect, and upstream's curl has no -L,
            //    which silently saved an empty tarball
            //  - the download's SHA-256 must match the tarball published with this installer (skipped only
            //    when DNS_TAR_URL points somewhere else), and the archive is verified before extracting;
            //    extraction failures abort, so a bad download leaves the running install untouched
            function makeInstaller(tag) {
              const tarUrl = `${base}/releases/download/${tag}/DnsServerPortable.tar.gz`;
              const label = (tag === rollingTag) ? `${owner}/${repo} latest build` : `${owner}/${repo} ${version}`;

              const replacements = [
                {
                  match: line => line.startsWith('dnsUrl='),
                  replace: () => [`dnsUrl="\${DNS_TAR_URL:-${tarUrl}}"`]
                },
                {
                  match: line => line === 'echo "Technitium DNS Server Installer"',
                  replace: () => [`echo "Technitium DNS Server Installer (${label})"`]
                },
                {
                  match: line => line === 'if ! curl -o $dnsTar --fail $dnsUrl >> $installLog 2>&1',
                  replace: () => ['if ! curl -L -o $dnsTar --fail $dnsUrl >> $installLog 2>&1']
                },
                {
                  match: line => line === 'tar -zxf $dnsTar -C $dnsDir >> $installLog 2>&1',
                  replace: () => [
                    'if [ -z "$DNS_TAR_URL" ]',
                    'then',
                    `    if ! echo "${tarballSha256}  $dnsTar" | sha256sum -c - >> $installLog 2>&1`,
                    '    then',
                    '        echo "The downloaded file does not match the SHA-256 of this release; it may be corrupted or tampered with: $dnsTar"',
                    '        echo "Nothing was changed; the installed version is still running. Please check \'$installLog\' for details."',
                    '        exit 1',
                    '    fi',
                    'fi',
                    '',
                    'if ! tar -tzf $dnsTar > /dev/null 2>> $installLog',
                    'then',
                    '    echo "Downloaded file is not a valid Technitium DNS Server archive: $dnsTar"',
                    '    echo "Nothing was changed; the installed version is still running. Please check \'$installLog\' for details."',
                    '    exit 1',
                    'fi',
                    '',
                    'if ! tar -zxf $dnsTar -C $dnsDir >> $installLog 2>&1',
                    'then',
                    '    echo "Failed to extract Technitium DNS Server to: $dnsDir"',
                    '    echo "Please check \'$installLog\' for details."',
                    '    exit 1',
                    'fi'
                  ]
                }
              ];

              const counts = replacements.map(() => 0);
              const out = [];

              for (const line of upstreamInstaller.replace(/\r\n/g, '\n').split('\n')) {
                const i = replacements.findIndex(r => r.match(line));

                if (i < 0) {
                  out.push(line);
                  continue;
                }

                counts[i]++;
                out.push(...replacements[i].replace());
              }

              counts.forEach(function (count, i) {
                if (count !== 1)
                  throw new Error(`installer patch ${i} matched ${count} lines in upstream install.sh (expected 1); upstream installer changed`);
              });

              return Buffer.from(out.join('\n'), 'utf8');
            }

            async function deleteReleaseAndTag(tag) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.deleteRelease({ owner, repo, release_id: existing.data.id });
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              } catch (e) {
                if ((e.status !== 404) && (e.status !== 422)) throw e;
              }
            }

            async function createRelease(tag, name, body, assets) {
              const release = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                body,
                prerelease: true
              });

              for (const [assetName, data, contentType] of assets) {
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo,
                  release_id: release.data.id,
                  name: assetName,
                  data,
                  headers: { 'content-type': contentType, 'content-length': data.length }
                });
              }
            }

            function releaseBody(installTag, note) {
              return [
                `Automated build **${version}** of \`${branch}\` at ${context.sha}.`,
                '',
                note,
                '```',
                `curl -fsSLo install.sh ${base}/releases/download/${installTag}/install.sh && sudo bash install.sh`,
                '```',
                '',
                `Tarball SHA-256: \`${tarballSha256}\` (also in SHA256SUMS; the installer checks it). Verify where it was built with:`,
                '```',
                `gh attestation verify DnsServerPortable.tar.gz -R ${owner}/${repo}`,
                '```',
                '',
                'Docker:',
                '```',
                `docker pull ghcr.io/${owner.toLowerCase()}/dnsserver:${version}`,
                '```',
                '',
                `Changes: ${base}/commits/${context.sha}`
              ].join('\n');
            }

            // 1. numbered release first so the feed below never points at a missing release
            await deleteReleaseAndTag(numberedTag); // only exists if this run is re-run
            await createRelease(numberedTag, `v${version}`,
              releaseBody(numberedTag, 'Install or roll back to exactly this build (keeps settings in /etc/dns):'),
              [
                ['DnsServerPortable.tar.gz', tarball, 'application/gzip'],
                ['install.sh', makeInstaller(numberedTag), 'text/x-shellscript'],
                ['SHA256SUMS', sha256Sums, 'text/plain']
              ]);

            // 2. update feed in the format the web console's "check for update" expects
            const updateJson = Buffer.from(JSON.stringify({
              updateVersion: version,
              updateTitle: `Fork build ${version} is available`,
              updateMessage: `A new build of the ${owner}/${repo} fork is available. Update by running the install command again; settings in /etc/dns are kept.`,
              downloadLink: `${base}/releases/tag/${numberedTag}`,
              instructionsLink: `${base}/blob/${branch}/FORK.md`,
              changeLogLink: `${base}/commits/${branch}`
            }, null, 2), 'utf8');

            // 3. rolling release
            await deleteReleaseAndTag(rollingTag);
            await createRelease(rollingTag, `Latest fork build (${version})`,
              releaseBody(rollingTag, 'Install or update to the newest build (keeps settings in /etc/dns):'),
              [
                ['DnsServerPortable.tar.gz', tarball, 'application/gzip'],
                ['install.sh', makeInstaller(rollingTag), 'text/x-shellscript'],
                ['SHA256SUMS', sha256Sums, 'text/plain'],
                ['update.json', updateJson, 'application/json']
              ]);

            // 4. prune old numbered releases
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const numbered = releases
              .filter(r => /^v\d+\.\d+\.\d+\.\d+$/.test(r.tag_name))
              .sort((a, b) => {
                const pa = a.tag_name.substring(1).split('.').map(Number);
                const pb = b.tag_name.substring(1).split('.').map(Number);
                for (let i = 0; i < 4; i++)
                  if (pa[i] !== pb[i]) return pb[i] - pa[i];
                return 0;
              });

            for (const old of numbered.slice(keep)) {
              core.info(`Pruning old release ${old.tag_name}`);
              await deleteReleaseAndTag(old.tag_name);
            }

            core.notice(`Published ${version}. Install: curl -fsSLo install.sh ${base}/releases/download/${rollingTag}/install.sh && sudo bash install.sh`);
